catalog:
  playwright: 1.63.0
  playwright-core: 1.63.0

packages:
  - '.'
  - '../../packages/internal'

overrides:
  '@swc/core': 1.10.0
  # jest-runtime 30.5 throws on module.register(), which Storybook's
  # serverRequire calls while @storybook/test-runner loads .storybook/test-runner.ts.
  'jest-runtime@>=30.5.0': 30.4.2
  playwright-core: 'catalog:'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  esbuild: true
  unrs-resolver: false
