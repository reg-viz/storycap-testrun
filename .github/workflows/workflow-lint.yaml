name: Workflow Lint

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          # Fail on findings instead of uploading SARIF to code scanning.
          advanced-security: false
          annotations: true
          # A new zizmor release can add audits; pin so unrelated PRs do not turn red.
          # Releases before 1.32 do not read actions.lock and flag every tag ref.
          version: 1.32.0

  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout and read the actions the lockfile records
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}

      # setup-node stays a `./` action because actionlint rejects `uses: $/...`,
      # so the lockfile cannot follow it and its own uses: keep commit SHAs.
      - run: gh actions-lock --verify --ignore-local-actions
        env:
          GH_TOKEN: ${{ github.token }}
