name: automerge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]

permissions:
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: automerge-gate/all-passed
    runs-on: ubuntu-latest
    # Must exceed the slowest CI job (test, including a cold Playwright
    # install) so the aggregator does not fail on its own timeout while polling.
    timeout-minutes: 20
    steps:
      - uses: pkgdeps/automerge-gate@cbf11cd35365922932ab22b36a646bbe02f7dae8 # v5.0.1
        with:
          gate-mode: 'public'
